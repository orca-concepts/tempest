<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Orca</title>
</head>
<body style="margin: 0; padding: 0; background-color: #faf9f7; font-family: Georgia, 'Times New Roman', serif; color: #111;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding: 40px 20px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border: 1px solid #e0ddd8; padding: 40px;">
          <tr>
            <td>
              <p style="margin: 0 0 20px; font-size: 16px;">Hi {{username}},</p>
              <p style="margin: 0 0 20px; font-size: 16px;">Welcome to Orca, a collaborative concept ontology platform for academic research.</p>
              {{#if orcidLinked}}<p style="margin: 0 0 20px; font-size: 16px;">Your ORCID iD is linked to your account.</p>{{/if}}
              <table cellpadding="0" cellspacing="0" style="margin: 30px 0;">
                <tr>
                  <td style="background-color: #111; padding: 12px 28px; border-radius: 4px;">
                    <a href="{{siteUrl}}" style="color: #ffffff; text-decoration: none; font-size: 16px; font-family: Georgia, 'Times New Roman', serif;">Go to Orca</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
